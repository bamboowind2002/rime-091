# Rime schema settings
# encoding: utf-8
name: wubi091
version: "0.6"
sort: original
columns:
  - code
  - text

encoder:
  exclude_patterns:
    - '^z.*$'
  rules:
    - length_equal: 2
      formula: "AaAbBaBb"
    - length_equal: 3
      formula: "AaBaCaCb"
    - length_in_range: [4, 10]
      formula: "AaBaCaZa"
...
